<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>水印工具</title>
<style>
@import url("https://fontsapi.zeoseven.com/444/main/result.css");
@import url("https://fontsapi.zeoseven.com/65/main/result.css");
@import url("https://fontsapi.zeoseven.com/256/main/result.css");
@import url("https://fontsapi.zeoseven.com/107/main/result.css");
@import url("https://fontsapi.zeoseven.com/137/main/result.css");

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0f0f14;--card:#1b1b24;--accent:#3a3a5c;--highlight:#c8a87e;--highlight-dim:#9a7d5a;--text:#e8e4dc;--text-dim:#8a857c;--border:#2e2e3a;--radius:6px}
html,body{height:100%;overflow:hidden}
body{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:13px;display:flex;flex-direction:column;height:100dvh;position:relative}
button{cursor:pointer;border:1px solid var(--border);background:var(--accent);color:var(--text);padding:5px 12px;border-radius:var(--radius);font-size:11px;transition:all .15s;letter-spacing:.3px}
button:hover{background:var(--highlight-dim);border-color:var(--highlight-dim);color:#fff}
button:active{transform:scale(.97)}
input[type="file"]{display:none}
input[type="text"],input[type="number"],input[type="color"],select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:3px 7px;font-size:11px;outline:none;transition:border-color .15s}
input[type="text"]:focus,input[type="number"]:focus,select:focus{border-color:var(--highlight)}
select{padding:3px 5px}
input[type="range"]{-webkit-appearance:none;height:3px;background:var(--border);border:none;border-radius:2px;outline:none}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--highlight);cursor:pointer;border:2px solid var(--bg)}
input[type="color"]{width:28px;height:22px;padding:1px 2px;cursor:pointer;border-radius:4px}

.toolbar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap;flex-shrink:0;z-index:60}
.toolbar-title{font-weight:600;font-size:13px;color:var(--highlight);margin-right:auto;letter-spacing:1px}
.toolbar-group{display:flex;align-items:center;gap:6px}
.eraser-tools{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text-dim);flex-wrap:wrap}
.eraser-tools input[type="range"]{width:54px}
.eraser-tools select{font-size:10px;padding:2px 4px}

.main-area{flex:1 1 0;min-height:0;position:relative;overflow:hidden}
.canvas-wrap{width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#08080c;touch-action:none}
.canvas-wrap canvas{display:block;max-width:calc(100% - 76px);max-height:100%;object-fit:contain}

.nav-btn{position:fixed;top:45%;transform:translateY(-50%);width:30px;height:52px;background:rgba(27,27,36,.82);color:var(--text-dim);border:1px solid var(--border);border-radius:var(--radius);font-size:18px;z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);transition:color .15s,background .15s;touch-action:manipulation}
.nav-btn:hover{color:var(--highlight);background:rgba(58,58,92,.9)}
.nav-btn.left{left:1px}
.nav-btn.right{right:1px}

.img-counter{position:absolute;top:6px;right:10px;background:rgba(0,0,0,.55);padding:2px 10px;border-radius:10px;font-size:10px;z-index:10;color:var(--text-dim);letter-spacing:.5px}
.no-img-msg{color:var(--text-dim);font-size:13px;text-align:center;padding:30px;letter-spacing:.5px}

.bottom-panel{background:var(--card);border-top:1px solid var(--border);flex-shrink:0;overflow:hidden;z-index:60}
.tabs-bar{display:flex;border-bottom:1px solid var(--border)}
.tab-btn{flex:1;padding:7px 0;text-align:center;font-size:11px;font-weight:600;color:var(--text-dim);cursor:pointer;border:none;background:transparent;border-bottom:2px solid transparent;transition:all .15s;letter-spacing:.5px}
.tab-btn.active{color:var(--highlight);border-bottom-color:var(--highlight)}
.tab-btn:hover{color:var(--text)}
.tab-content{display:none;padding:6px 10px;max-height:22vh;overflow-y:auto}
.tab-content.active{display:block}
.tab-content::-webkit-scrollbar{width:3px}
.tab-content::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.row{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap}
.wm-list{display:flex;flex-direction:column;gap:3px}
.wm-item{display:flex;align-items:center;gap:5px;padding:4px 5px;background:var(--bg);border-radius:var(--radius);font-size:10px;border:1px solid transparent;transition:border-color .15s;flex-wrap:wrap}
.wm-item:hover{border-color:var(--border)}
.wm-item.locked .wm-controls{pointer-events:none;opacity:.5}
.wm-item.locked .wm-lock-btn{pointer-events:auto!important;opacity:1!important}
.wm-item img{width:24px;height:24px;object-fit:contain;border-radius:3px;background:#222}
.wm-item .wm-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;padding:1px 3px;border-radius:3px;border:1px solid transparent;min-width:36px;color:var(--text);font-size:10px}
.wm-item .wm-name:hover{border-color:var(--border)}
.wm-item .wm-size-label{font-size:9px;color:var(--text-dim);white-space:nowrap;min-width:26px;text-align:right;cursor:pointer;border-radius:3px;padding:1px 3px;border:1px solid transparent;transition:border-color .15s}
.wm-item .wm-size-label:hover{border-color:var(--border)}
.wm-item input[type="range"]{width:40px}
.wm-item select{font-size:10px;padding:2px 3px}
.wm-item button{padding:2px 6px;font-size:9px}
.wm-item .wm-drag-handle{cursor:grab;font-size:14px;color:var(--text-dim);user-select:none;padding:0 2px;touch-action:none}
.wm-item .wm-drag-handle:active{cursor:grabbing}

.thumb-strip{display:flex;gap:4px;overflow-x:auto;padding:3px 0}
.thumb-strip::-webkit-scrollbar{height:3px}
.thumb-strip::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.thumb-strip .thumb{width:40px;height:40px;border-radius:4px;object-fit:cover;border:2px solid transparent;cursor:pointer;flex-shrink:0;transition:border-color .15s}
.thumb-strip .thumb.active{border-color:var(--highlight)}

.switch-wrap{display:flex;align-items:center;gap:4px}
.switch-wrap label{font-size:10px;color:var(--text-dim)}
.switch{position:relative;width:30px;height:16px;background:var(--border);border-radius:8px;cursor:pointer;transition:background .2s;flex-shrink:0}
.switch.on{background:var(--highlight)}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;background:#fff;border-radius:50%;transition:left .2s}
.switch.on::after{left:16px}

.export-bar{display:flex;gap:5px;padding:6px 10px;background:var(--card);border-top:1px solid var(--border);flex-shrink:0;align-items:center;z-index:60;flex-wrap:wrap}
.export-bar button{flex:1;min-width:0;padding:6px 4px;font-size:10px}
.export-bar select{font-size:10px;padding:3px 5px;flex-shrink:0}
.export-bar .del-btn{background:#5c2a2a;border-color:#7a3a3a;color:#e8b0b0}
.export-bar .del-btn:hover{background:#7a3a3a;color:#fff}

.eraser-circle-indicator{position:absolute;border:1.5px dashed rgba(200,168,126,.5);border-radius:50%;pointer-events:none;z-index:20;display:none}

.wm-row-sub{display:flex;align-items:center;gap:5px;width:100%;padding-left:29px;margin-top:2px}
.wm-row-sub label{font-size:9px;color:var(--text-dim);white-space:nowrap}
.wm-row-sub input[type="range"]{width:50px}
.wm-row-sub span{font-size:9px;color:var(--text-dim);min-width:22px;text-align:right}

.text-wm-preview{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:3px;background:#222;font-size:12px;overflow:hidden;flex-shrink:0}

.editable-value{cursor:pointer;border:1px solid transparent;border-radius:3px;padding:1px 3px;transition:border-color .15s}
.editable-value:hover{border-color:var(--border)}
.editable-value-input{background:var(--bg);color:var(--text);border:1px solid var(--highlight);border-radius:3px;padding:1px 4px;font-size:9px;width:42px;text-align:right;outline:none}

.collage-panel{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:600;flex-direction:column;overflow:hidden}
.collage-panel.active{display:flex}
.collage-header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
.collage-header .ctitle{font-size:13px;font-weight:600;color:var(--highlight);flex:1}
.collage-body{flex:1;overflow-y:auto;padding:10px 12px}
.collage-body::-webkit-scrollbar{width:3px}
.collage-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.collage-thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.collage-thumbs .ct-item{position:relative;width:60px;height:60px;border-radius:4px;overflow:hidden;border:1px solid var(--border)}
.collage-thumbs .ct-item img{width:100%;height:100%;object-fit:cover}
.collage-thumbs .ct-item .ct-remove{position:absolute;top:1px;right:1px;width:16px;height:16px;background:rgba(0,0,0,.7);color:#e88;border:none;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;line-height:1}
.collage-thumbs .ct-item .ct-remove:hover{background:#c44;color:#fff}
.collage-settings{display:flex;flex-direction:column;gap:6px}
.collage-settings .cs-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.collage-settings .cs-row label{font-size:10px;color:var(--text-dim);white-space:nowrap}
.collage-settings .cs-row input,.collage-settings .cs-row select{font-size:10px}
.collage-settings .cs-row input[type="number"]{width:50px;padding:3px 5px}
.collage-footer{display:flex;gap:8px;padding:8px 12px;background:var(--card);border-top:1px solid var(--border);flex-shrink:0}
.collage-footer button{flex:1;padding:7px 4px;font-size:11px}

.collage-preview-wrap{margin-top:8px;display:flex;align-items:center;justify-content:center;min-height:100px;background:var(--bg);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden}
.collage-preview-wrap canvas,.collage-preview-wrap img{max-width:100%;max-height:200px;object-fit:contain}

@media(max-width:480px){
  .toolbar{padding:5px 7px;gap:5px}
  .tab-content{padding:5px 7px;max-height:20vh}
  .wm-item input[type="range"]{width:34px}
  .wm-row-sub input[type="range"]{width:40px}
  .eraser-tools input[type="range"]{width:46px}
  .canvas-wrap canvas{max-width:calc(100% - 68px)}
  .export-bar{padding:5px 7px;gap:4px}
  .export-bar button{padding:5px 2px;font-size:9px}
}

.tab-header-sticky{position:sticky;top:0;z-index:10;background:var(--card);padding-bottom:4px;border-bottom:1px solid var(--border);margin-bottom:4px}
.tab-header-sticky .row{margin-bottom:0}
.edit-mode-btn{font-size:10px;padding:3px 8px;background:transparent;border-color:var(--border);color:var(--text-dim)}
.edit-mode-btn.active{background:var(--highlight-dim);border-color:var(--highlight);color:#fff}
.wm-item .wm-del-btn{display:none;padding:1px 5px;font-size:9px;background:transparent;border-color:var(--highlight-dim);color:var(--highlight)}
.wm-item.edit-visible .wm-del-btn{display:inline-flex}

.preset-bar{display:flex;align-items:center;gap:6px;padding:5px 10px;padding-right:80px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0;z-index:59;overflow-x:auto;position:relative}
.preset-bar::-webkit-scrollbar{height:3px}
.preset-bar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.preset-item{display:flex;align-items:center;gap:3px;padding:4px 10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);font-size:10px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:border-color .15s,background .15s}
.preset-item:hover{border-color:var(--highlight-dim)}
.preset-item.active{border-color:var(--highlight);background:var(--accent)}
.preset-item .preset-del{display:none;margin-left:3px;font-size:9px;color:#e88;cursor:pointer;padding:0 2px}
.preset-bar.edit-mode .preset-item .preset-del{display:inline}
.preset-item .preset-name{cursor:pointer}
.preset-bar.edit-mode .preset-item .preset-name{border-bottom:1px dashed var(--text-dim)}
.preset-fixed-btns{position:fixed;right:6px;display:flex;align-items:center;gap:4px;z-index:61;background:var(--card);padding:3px 6px;border-radius:var(--radius);border:1px solid var(--border)}
.preset-add-btn{padding:3px 8px;font-size:12px;background:transparent;border-color:var(--border);color:var(--highlight);flex-shrink:0}
.preset-edit-btn{padding:3px 8px;font-size:10px;background:transparent;border-color:var(--border);color:var(--text-dim);flex-shrink:0}
.preset-edit-btn.active{background:var(--highlight-dim);border-color:var(--highlight);color:#fff}
.preset-item .preset-switch-alt{display:none;margin-left:3px;font-size:9px;color:var(--highlight);cursor:pointer;padding:0 3px;border:1px solid var(--border);border-radius:3px;background:transparent}
.preset-item .preset-switch-alt:hover{background:var(--accent);border-color:var(--highlight-dim)}
.preset-item.has-alt .preset-switch-alt{display:inline}

.parallel-layer-section{display:flex;align-items:center;gap:4px;padding-left:29px;margin-top:2px;flex-wrap:wrap}
.parallel-add-btn{padding:1px 6px;font-size:11px;background:transparent;border-color:var(--highlight-dim);color:var(--highlight);cursor:pointer;border-radius:3px}
.parallel-add-btn:hover{background:var(--accent)}
.parallel-tag{display:flex;align-items:center;gap:2px;padding:1px 6px;background:var(--bg);border:1px solid var(--border);border-radius:3px;font-size:9px;color:var(--text-dim);cursor:pointer;transition:border-color .15s}
.parallel-tag:hover{border-color:var(--highlight-dim)}
.parallel-tag.active{border-color:var(--highlight);color:var(--highlight)}
.parallel-tag .ptag-del{font-size:8px;color:#e88;cursor:pointer;margin-left:2px;display:none}
.wm-item.edit-visible .parallel-tag .ptag-del{display:inline}

</style>
</head>
<body>
<!-- disable-default-loading -->

<div class="toolbar">
  <span class="toolbar-title">WATERMARK</span>
  <div class="toolbar-group">
    <button onclick="document.getElementById('fileImg').click()">上传图片</button>
    <input type="file" id="fileImg" accept="image/*" multiple>
  </div>
  <div class="toolbar-group">
    <button onclick="syncAllFromCurrent()" title="将当前图片的所有水印设置同步到其他所有图片（不同步橡皮擦）" style="background:#4a3a6c;border-color:#6a5a8c;font-size:10px;padding:4px 10px">全同步</button>
  </div>
  <div class="toolbar-group">
    <div class="switch-wrap"><label>同步</label><div class="switch" id="syncSwitch" onclick="toggleSync()"></div></div>
  </div>
  <div class="toolbar-group">
    <div class="switch-wrap"><label>橡皮擦</label><div class="switch" id="eraserSwitch" onclick="toggleEraser()"></div></div>
    <div class="eraser-tools" id="eraserTools" style="display:none">
      <select id="eraserType" onchange="updateEraserUI()">
        <option value="hard">硬橡皮</option>
        <option value="soft">软橡皮</option>
      </select>
      <label>径</label>
      <input type="range" id="eraserSize" min="10" max="800" value="60" oninput="updateEraserSize()">
      <span id="eraserSizeVal">60</span>
      <label>强度</label>
      <input type="range" id="eraserOpacity" min="0" max="100" value="100" oninput="document.getElementById('eraserOpacityVal').textContent=this.value+'%'">
      <span id="eraserOpacityVal">100%</span>
      <span id="softHardnessWrap" style="display:none">
        <label>硬度</label>
        <input type="range" id="eraserHardness" min="0" max="100" value="50" oninput="document.getElementById('eraserHardnessVal').textContent=this.value+'%'">
        <span id="eraserHardnessVal">50%</span>
      </span>
    </div>
  </div>
</div>

<div class="main-area" id="mainArea">
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="mainCanvas"></canvas>
    <div class="img-counter" id="imgCounter" style="display:none"></div>
    <div class="no-img-msg" id="noImgMsg">点击「上传图片」开始</div>
    <div class="eraser-circle-indicator" id="eraserIndicator"></div>
  </div>
</div>

<button class="nav-btn left" onclick="navImg(-1)">‹</button>
<button class="nav-btn right" onclick="navImg(1)">›</button>

<div class="preset-bar" id="presetBar">
  <span style="font-size:10px;color:var(--text-dim);flex-shrink:0;font-weight:600">预设</span>
  <div id="presetList" style="display:contents"></div>
  <div class="preset-fixed-btns" id="presetFixedBtns">
    <button class="preset-add-btn" onclick="addPreset()" title="保存当前设置为预设">＋</button>
    <button class="preset-edit-btn" id="presetEditBtn" onclick="togglePresetEdit()" title="编辑预设">编辑</button>
  </div>
</div>

<div class="bottom-panel" id="bottomPanel">
  <div class="tabs-bar">
    <div class="tab-btn active" data-tab="tabThumbs" onclick="switchTab(this)">缩略图</div>
    <div class="tab-btn" data-tab="tabTile" onclick="switchTab(this)">底纹水印</div>
    <div class="tab-btn" data-tab="tabIcon" onclick="switchTab(this)">图标水印</div>
    <div class="tab-btn" data-tab="tabCollage" onclick="switchTab(this)">拼图/动图</div>
  </div>
  <div class="tab-content active" id="tabThumbs">
    <div class="thumb-strip" id="thumbStrip"></div>
  </div>
  <div class="tab-content" id="tabTile">
    <div class="tab-header-sticky">
      <div class="row">
        <button onclick="document.getElementById('fileTile').click()">上传底纹</button>
        <input type="file" id="fileTile" accept="image/*">
        <button class="edit-mode-btn" id="tileEditBtn" onclick="toggleWmEditMode('tile')">编辑</button>
      </div>
    </div>
    <div class="wm-list" id="tileWmList"></div>
  </div>
  <div class="tab-content" id="tabIcon">
    <div class="tab-header-sticky">
      <div class="row">
        <button onclick="document.getElementById('fileIcon').click()">上传图标</button>
        <input type="file" id="fileIcon" accept="image/*">
        <button onclick="openTextWmDialog()">添加文字</button>
        <button class="edit-mode-btn" id="iconEditBtn" onclick="toggleWmEditMode('icon')">编辑</button>
      </div>
    </div>
    <div class="wm-list" id="iconWmList"></div>
  </div>
  <div class="tab-content" id="tabCollage">
    <div class="row">
      <button onclick="openCollagePanel()">导出拼图</button>
      <button onclick="openGifPanel()">导出动图</button>
    </div>
  </div>
</div>

<div class="export-bar">
  <select id="exportFormat"><option value="png">PNG</option><option value="jpg">JPG</option></select>
  <input type="range" id="jpgQuality" min="10" max="100" value="85" style="width:46px;display:none" oninput="document.getElementById('jpgQualityVal').textContent=this.value+'%'">
  <span id="jpgQualityVal" style="font-size:10px;color:var(--text-dim);display:none">85%</span>
  <button onclick="exportCurrent()">导出当前</button>
  <button onclick="exportAll()">导出全部</button>
  <button class="del-btn" onclick="deleteCurrent()">删除当前</button>
  <button class="del-btn" onclick="deleteAllImages()">全部删除</button>
</div>

<!-- Text watermark dialog -->
<div id="textWmOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;align-items:center;justify-content:center">
  <div style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 16px;width:90%;max-width:340px;display:flex;flex-direction:column;gap:8px">
    <div style="font-size:12px;font-weight:600;color:var(--highlight)">添加文字水印</div>
    <input type="text" id="twmText" placeholder="输入文字内容" style="width:100%;padding:6px 8px;font-size:12px">
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      <label style="font-size:10px;color:var(--text-dim)">字体</label>
      <select id="twmFont" style="flex:1;font-size:10px;padding:3px 5px">
        <option value="sans-serif">默认黑体</option>
        <option value="serif">宋体</option>
        <option value="YFHCT">手写体</option>
        <option value="BoutiqueBitmap9x9 1.5 R">像素体</option>
        <option value="Huiwen-mincho">古风体</option>
        <option value="CaoShu Simp2Trad">草书</option>
        <option value="Mengshen-Handwritten">萌萌手写体</option>
      </select>
    </div>
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      <label style="font-size:10px;color:var(--text-dim)">颜色</label>
      <input type="color" id="twmColor" value="#ffffff">
      <label style="font-size:10px;color:var(--text-dim)">大小</label>
      <input type="range" id="twmSize" min="12" max="400" value="48" style="width:70px">
      <span id="twmSizeVal" style="font-size:10px;color:var(--text-dim)">48</span>
    </div>
    <div style="display:flex;gap:6px;align-items:center">
      <label style="font-size:10px;color:var(--text-dim)">粗体</label>
      <div class="switch" id="twmBoldSwitch" onclick="this.classList.toggle('on')"></div>
      <label style="font-size:10px;color:var(--text-dim)">斜体</label>

<script>
// ===== Optimized GIF Encoder using Web Worker approach with chunked processing =====
class GIFEncoder{
constructor(w,h,quality){this.width=w;this.height=h;this.frames=[];this.quality=quality||'medium'}
addFrame(canvas,delay){
  // Store as smaller JPEG data to reduce memory
  const sc=document.createElement('canvas');
  sc.width=this.width;sc.height=this.height;
  const sctx=sc.getContext('2d');
  sctx.drawImage(canvas,0,0,this.width,this.height);
  const imgData=sctx.getImageData(0,0,this.width,this.height);
  this.frames.push({data:imgData.data,delay:delay||100});
}
async encode(progressCb){
  const frames=this.frames,w=this.width,h=this.height;
  const palSize=this.quality==='low'?64:(this.quality==='high'?256:128);
  const palette=this._buildPalette(palSize);
  const colorTable=new Uint8Array(256*3);
  for(let i=0;i<256;i++){
    if(i<palette.length){colorTable[i*3]=palette[i][0];colorTable[i*3+1]=palette[i][1];colorTable[i*3+2]=palette[i][2]}
    else{colorTable[i*3]=0;colorTable[i*3+1]=0;colorTable[i*3+2]=0}
  }
  const out=[];
  this._writeStr(out,'GIF89a');
  this._writeShort(out,w);this._writeShort(out,h);
  out.push(0xF7);out.push(0);out.push(0);
  for(let i=0;i<768;i++)out.push(colorTable[i]);
  out.push(0x21,0xFF,0x0B);this._writeStr(out,'NETSCAPE2.0');out.push(3,1);this._writeShort(out,0);out.push(0);

  for(let fi=0;fi<frames.length;fi++){
    const frame=frames[fi];
    out.push(0x21,0xF9,4,0);this._writeShort(out,Math.round(frame.delay/10));out.push(0,0);
    out.push(0x2C);this._writeShort(out,0);this._writeShort(out,0);this._writeShort(out,w);this._writeShort(out,h);
    out.push(0);
    const indices=this._quantizeFrame(frame.data,palette);
    const minCode=8;out.push(minCode);
    const lzwData=this._lzwEncode(indices,minCode);
    let pos=0;while(pos<lzwData.length){const chunk=Math.min(255,lzwData.length-pos);out.push(chunk);for(let i=0;i<chunk;i++)out.push(lzwData[pos++])}
    out.push(0);
    if(progressCb)progressCb(fi+1,frames.length);
    // Yield to browser every few frames to prevent freeze
    if(fi%2===0)await new Promise(r=>setTimeout(r,0));
  }
  out.push(0x3B);
  return new Uint8Array(out);
}
_buildPalette(maxColors){
  // Sample pixels from first frame for speed
  const data=this.frames[0].data;
  const step=Math.max(4,Math.floor(data.length/(4*5000)))*4;
  const div=Math.round(Math.pow(maxColors,1/3));
  const palette=[];
  for(let r=0;r<div;r++)for(let g=0;g<div;g++)for(let b=0;b<div;b++){
    palette.push([Math.round(r*255/(div-1)),Math.round(g*255/(div-1)),Math.round(b*255/(div-1))])}
  while(palette.length<256)palette.push([0,0,0]);
  return palette.slice(0,256);
}
_quantizeFrame(data,palette){
  const len=data.length/4;const indices=new Uint8Array(len);
  // Build lookup cache for speed
  const cache=new Map();
  for(let i=0;i<len;i++){
    const r=data[i*4],g=data[i*4+1],b=data[i*4+2];
    const key=(r>>3)<<10|(g>>3)<<5|(b>>3);
    if(cache.has(key)){indices[i]=cache.get(key);continue}
    let best=0,bestD=Infinity;
    for(let j=0;j<palette.length;j++){
      const dr=r-palette[j][0],dg=g-palette[j][1],db=b-palette[j][2];
      const d=dr*dr+dg*dg+db*db;
      if(d<bestD){bestD=d;best=j;if(d===0)break}
    }
    indices[i]=best;cache.set(key,best);
  }
  return indices;
}
_lzwEncode(indices,minCode){
  const clearCode=1<<minCode,eoiCode=clearCode+1;
  let codeSize=minCode+1,nextCode=eoiCode+1,maxCode=(1<<codeSize);
  const table=new Map();const output=[];let buf=0,bitPos=0;
  function writeBits(code,size){buf|=(code<<bitPos);bitPos+=size;while(bitPos>=8){output.push(buf&0xFF);buf>>=8;bitPos-=8}}
  writeBits(clearCode,codeSize);
  let prev=indices[0];
  for(let i=1;i<indices.length;i++){
    const curr=indices[i];const key=(prev<<12)|curr;
    if(table.has(key)){prev=table.get(key)}
    else{writeBits(prev,codeSize);
      if(nextCode<4096){table.set(key,nextCode++);if(nextCode>maxCode&&codeSize<12){codeSize++;maxCode=1<<codeSize}}
      else{writeBits(clearCode,codeSize);table.clear();codeSize=minCode+1;nextCode=eoiCode+1;maxCode=1<<codeSize}
      prev=curr}}
  writeBits(prev,codeSize);writeBits(eoiCode,codeSize);
  if(bitPos>0)output.push(buf&0xFF);return output}
_writeStr(out,s){for(let i=0;i<s.length;i++)out.push(s.charCodeAt(i))}
_writeShort(out,v){out.push(v&0xFF);out.push((v>>8)&0xFF)}
}

function textToDataURL(text,font,color,size,bold,italic){
  const c=document.createElement('canvas'),cx=c.getContext('2d');
  const style=(italic?'italic ':'')+(bold?'bold ':'')+size+'px "'+font+'", sans-serif';
  cx.font=style;
  const m=cx.measureText(text);
  const w=Math.ceil(m.width)+10,h=Math.ceil(size*1.4)+10;
  c.width=w;c.height=h;
  cx.font=style;cx.fillStyle=color;cx.textBaseline='middle';cx.fillText(text,5,h/2);
  return c.toDataURL('image/png');
}

async function createTextWm(){
  const text=document.getElementById('twmText').value.trim();
  if(!text){closeTextWmDialog();return}
  const font=document.getElementById('twmFont').value;
  const color=document.getElementById('twmColor').value;
  const size=parseInt(document.getElementById('twmSize').value);
  const bold=document.getElementById('twmBoldSwitch').classList.contains('on');
  const italic=document.getElementById('twmItalicSwitch').classList.contains('on');
  const du=textToDataURL(text,font,color,size,bold,italic);
  const wm={name:'文字_'+text.substring(0,6),type:'icon',subtype:'text',dataURL:du,locked:false,
    textData:{text,font,color,size,bold,italic}};
  wm.id=await dbPut('watermarks',wm);watermarks.push(wm);wmOrderIcon.push(wm.id);
  debouncedSave();refreshAll();closeTextWmDialog();
}

function syncAllFromCurrent(){
  if(!images.length)return;
  if(images.length<2)return;
  const cur=images[currentIdx];
  const srcState=cur.wmState;
  for(let i=0;i<images.length;i++){
    if(i===currentIdx)continue;
    const target=images[i];
    target.wmState={};
    for(const wmId in srcState){
      target.wmState[wmId]=JSON.parse(JSON.stringify(srcState[wmId]));
    }
  }
  debouncedSave();refreshAll();
}

function makeEditableValue(span,currentVal,suffix,min,max,onChange){
  span.addEventListener('click',function(){
    if(span.querySelector('input'))return;
    const inp=document.createElement('input');
    inp.type='text';
    inp.className='editable-value-input';
    inp.value=parseFloat(currentVal()).toFixed(suffix==='°'?0:(suffix==='%'?0:1));
    const origText=span.textContent;
    span.textContent='';
    span.appendChild(inp);
    inp.focus();inp.select();
    const commit=()=>{
      let v=parseFloat(inp.value);
      if(isNaN(v))v=parseFloat(origText);
      if(isNaN(v))v=min;
      v=Math.max(min,Math.min(max,v));
      onChange(v);
      span.textContent=(suffix==='%'?Math.round(v):Math.round(v))+suffix;};
    inp.addEventListener('blur',commit);
    inp.addEventListener('keydown',function(e){
      if(e.key==='Enter'){e.preventDefault();inp.blur();}
      if(e.key==='Escape'){inp.value=origText;inp.blur();}
    });
  });
}

const DB_NAME='watermarkToolDB',DB_VER=8;let db=null;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VER);r.onupgradeneeded=e=>{const d=e.target.result;['images','watermarks','state'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,s==='state'?{keyPath:'key'}:{keyPath:'id',autoIncrement:true})})};r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=rej})}
function dbPut(s,v){return new Promise((r,j)=>{const tx=db.transaction(s,'readwrite');tx.objectStore(s).put(v).onsuccess=e=>r(e.target.result);tx.onerror=j})}
function dbGetAll(s){return new Promise(r=>{db.transaction(s,'readonly').objectStore(s).getAll().onsuccess=e=>r(e.target.result)})}
function dbDelete(s,id){return new Promise(r=>{const tx=db.transaction(s,'readwrite');tx.objectStore(s).delete(id);tx.oncomplete=()=>r()})}
function dbClear(s){return new Promise(r=>{const tx=db.transaction(s,'readwrite');tx.objectStore(s).clear();tx.oncomplete=()=>r()})}

let images=[],currentIdx=0,watermarks=[],syncMode=false,eraserMode=false,eraserRadius=30;
let renderQueued=false,renderRAF=0,imageCache=new Map(),selectedIconWmId=null;
let wmOrderTile=[],wmOrderIcon=[];

const canvas=document.getElementById('mainCanvas'),ctx=canvas.getContext('2d'),canvasWrap=document.getElementById('canvasWrap');

function toggleSync(){syncMode=!syncMode;document.getElementById('syncSwitch').classList.toggle('on',syncMode)}
function toggleEraser(){eraserMode=!eraserMode;document.getElementById('eraserSwitch').classList.toggle('on',eraserMode);document.getElementById('eraserTools').style.display=eraserMode?'flex':'none';document.getElementById('eraserIndicator').style.display='none';selectedIconWmId=null;queueRender()}
function updateEraserSize(){eraserRadius=parseInt(document.getElementById('eraserSize').value)/2;document.getElementById('eraserSizeVal').textContent=eraserRadius*2}

let saveTimeout=null;
function debouncedSave(){clearTimeout(saveTimeout);saveTimeout=setTimeout(saveState,800)}
async function saveState(){
  await dbClear('images');for(const im of images)await dbPut('images',{id:im.id,dataURL:im.dataURL,wmState:im.wmState,erasers:im.erasers});
  await dbClear('watermarks');for(const wm of watermarks)await dbPut('watermarks',wm);
  await dbPut('state',{key:'currentIdx',value:currentIdx});
  await dbPut('state',{key:'wmOrderTile',value:wmOrderTile});
  await dbPut('state',{key:'wmOrderIcon',value:wmOrderIcon});
}
async function loadState(){
  images=await dbGetAll('images');watermarks=await dbGetAll('watermarks');
  const ir=await new Promise(r=>{const tx=db.transaction('state','readonly');const req=tx.objectStore('state').get('currentIdx');req.onsuccess=()=>r(req.result);req.onerror=()=>r(null)});
  currentIdx=ir?ir.value:0;if(currentIdx>=images.length)currentIdx=Math.max(0,images.length-1);
  images.forEach(img=>{if(!img.wmState)img.wmState={};if(!img.erasers)img.erasers=[]});
  const otR=await new Promise(r=>{const tx=db.transaction('state','readonly');const req=tx.objectStore('state').get('wmOrderTile');req.onsuccess=()=>r(req.result);req.onerror=()=>r(null)});
  wmOrderTile=otR?otR.value:[];
  const oiR=await new Promise(r=>{const tx=db.transaction('state','readonly');const req=tx.objectStore('state').get('wmOrderIcon');req.onsuccess=()=>r(req.result);req.onerror=()=>r(null)});
  wmOrderIcon=oiR?oiR.value:[];
  syncWmOrders();
  await loadPresets();
  renderPresets();
}
function syncWmOrders(){
  const tileIds=watermarks.filter(w=>w.type==='tile').map(w=>w.id);
  const iconIds=watermarks.filter(w=>w.type==='icon').map(w=>w.id);
  wmOrderTile=wmOrderTile.filter(id=>tileIds.includes(id));
  tileIds.forEach(id=>{if(!wmOrderTile.includes(id))wmOrderTile.push(id)});
  wmOrderIcon=wmOrderIcon.filter(id=>iconIds.includes(id));
  iconIds.forEach(id=>{if(!wmOrderIcon.includes(id))wmOrderIcon.push(id)});
}

function fileToDataURL(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)})}
function loadImage(src){if(imageCache.has(src))return Promise.resolve(imageCache.get(src));return new Promise((r,j)=>{const img=new Image();img.onload=()=>{imageCache.set(src,img);r(img)};img.onerror=j;img.src=src})}

const DEFAULT_WM_STATE={enabled:false,blendMode:'normal',opacity:1,x:0.5,y:0.5,scale:1,rotation:0,ignoreEraser:false};
const DEFAULT_TILE_STATE={enabled:false,blendMode:'normal',opacity:1,x:0,y:0,scale:1,rotation:0,ignoreEraser:false};

function getDefaultState(wm){
  if(wm.type==='tile')return {...DEFAULT_TILE_STATE};
  return {...DEFAULT_WM_STATE};
}

document.getElementById('fileImg').addEventListener('change',async function(){
  const files=[...this.files];if(!files.length)return;
  for(const f of files){
    const du=await fileToDataURL(f);
    const newWmState={};
    const curImg=images[currentIdx];
    watermarks.forEach(wm=>{
      if(curImg&&curImg.wmState[wm.id]){
        const src=curImg.wmState[wm.id];
        const def=getDefaultState(wm);
        newWmState[wm.id]={enabled:false,blendMode:src.blendMode||def.blendMode,opacity:src.opacity!==undefined?src.opacity:def.opacity,
          x:src.x!==undefined?src.x:def.x,y:src.y!==undefined?src.y:def.y,
          scale:src.scale!==undefined?src.scale:def.scale,rotation:src.rotation!==undefined?src.rotation:def.rotation,
          ignoreEraser:src.ignoreEraser||false};
      }else{
        newWmState[wm.id]={...getDefaultState(wm)};
      }
    });
    const o={dataURL:du,wmState:newWmState,erasers:[]};
    o.id=await dbPut('images',o);images.push(o);
  }
  currentIdx=images.length-1;debouncedSave();refreshAll();this.value='';
});
document.getElementById('fileTile').addEventListener('change',async function(){if(!this.files[0])return;const du=await fileToDataURL(this.files[0]);const wm={name:'底纹_'+(watermarks.filter(w=>w.type==='tile').length+1),type:'tile',dataURL:du,locked:false};wm.id=await dbPut('watermarks',wm);watermarks.push(wm);wmOrderTile.push(wm.id);debouncedSave();refreshAll();this.value=''});
document.getElementById('fileIcon').addEventListener('change',async function(){if(!this.files[0])return;const du=await fileToDataURL(this.files[0]);const wm={name:'图标_'+(watermarks.filter(w=>w.type==='icon').length+1),type:'icon',dataURL:du,locked:false};wm.id=await dbPut('watermarks',wm);watermarks.push(wm);wmOrderIcon.push(wm.id);debouncedSave();refreshAll();this.value=''});

function getWmState(imgObj,wmId){
  const wm=watermarks.find(w=>w.id===wmId);
  const def=wm?getDefaultState(wm):DEFAULT_WM_STATE;
  if(!imgObj.wmState[wmId])imgObj.wmState[wmId]={...def};
  const ws=imgObj.wmState[wmId];
  if(ws.scale===undefined)ws.scale=def.scale;
  if(ws.rotation===undefined)ws.rotation=def.rotation;
  if(ws.opacity===undefined)ws.opacity=def.opacity;
  if(ws.x===undefined)ws.x=def.x;
  if(ws.y===undefined)ws.y=def.y;
  if(ws.ignoreEraser===undefined)ws.ignoreEraser=false;
  return ws;
}

function navImg(dir){if(!images.length)return;currentIdx=(currentIdx+dir+images.length)%images.length;selectedIconWmId=null;debouncedSave();refreshAll()}
function queueRender(){if(renderQueued)return;renderQueued=true;if(renderRAF)cancelAnimationFrame(renderRAF);renderRAF=requestAnimationFrame(()=>{renderQueued=false;renderRAF=0;renderCanvas()})}

function refreshAll(){renderThumbs();renderWmLists();queueRender();const cnt=document.getElementById('imgCounter'),msg=document.getElementById('noImgMsg');if(images.length){cnt.style.display='';cnt.textContent=(currentIdx+1)+' / '+images.length;msg.style.display='none';canvas.style.display=''}else{cnt.style.display='none';msg.style.display='';canvas.style.display='none'}}

const BLEND_MODES=['normal','multiply','screen','overlay','darken','lighten','color-dodge','color-burn','hard-light','soft-light','difference','exclusion'];
const BLEND_LABELS={'normal':'正常','multiply':'正片叠底','screen':'滤色','overlay':'叠加','darken':'变暗','lighten':'变亮','color-dodge':'颜色减淡','color-burn':'颜色加深','hard-light':'强光','soft-light':'柔光','difference':'差值','exclusion':'排除'};

function startRename(span,wm){

function addPreset(){
  if(!images.length)return;
  const cur=images[currentIdx];
  const wmSnapshot={};
  // Record which wm ids exist at save time
  const savedWmIds=[];
  watermarks.forEach(wm=>{
    const ws=getWmState(cur,wm.id);
    wmSnapshot[wm.id]=JSON.parse(JSON.stringify(ws));
    savedWmIds.push(wm.id);
  });
  // Also snapshot parallel layer active selections for icon watermarks
  const parallelSnapshot={};
  watermarks.forEach(wm=>{
    if(wm.type==='icon'&&wm.parallelLayers&&wm.parallelLayers.length>0){
      const activeIdx=wm.activeParallelIdx||0;
      parallelSnapshot[wm.id]={activeIdx,layerCount:wm.parallelLayers.length};
    }
  });
  const exportFmt=document.getElementById('exportFormat').value;
  const jpgQ=parseInt(document.getElementById('jpgQuality').value);
  const name='预设'+(presets.length+1);
  presets.push({name,wmState:wmSnapshot,exportFormat:exportFmt,jpgQuality:jpgQ,savedWmIds,parallelSnapshot});
  savePresets();renderPresets();
}

function applyPreset(idx){
  const p=presets[idx];if(!p)return;
  images.forEach(img=>{
    // Apply saved wm states
    for(const wmId in p.wmState){
      const numId=parseInt(wmId);
      if(watermarks.find(w=>w.id===numId)){
        img.wmState[numId]=JSON.parse(JSON.stringify(p.wmState[wmId]));
      }
    }
    // For watermarks that didn't exist when preset was saved, default to disabled
    watermarks.forEach(wm=>{
      if(p.savedWmIds&&!p.savedWmIds.includes(wm.id)){
        const def=getDefaultState(wm);
        def.enabled=false;
        img.wmState[wm.id]={...def};
      }
    });
  });
  // Apply parallel layer selections
  if(p.parallelSnapshot){
    for(const wmId in p.parallelSnapshot){
      const numId=parseInt(wmId);
      const wm=watermarks.find(w=>w.id===numId);
      if(wm&&wm.parallelLayers){
        const snap=p.parallelSnapshot[wmId];
        const targetIdx=snap.activeIdx||0;
        if(targetIdx<(wm.parallelLayers.length+1)){
          switchParallelLayer(wm,targetIdx);
        }
      }
    }
  }
  // Apply export settings
  document.getElementById('exportFormat').value=p.exportFormat||'png';
  const isJpg=p.exportFormat==='jpg';
  document.getElementById('jpgQuality').style.display=isJpg?'':'none';
  document.getElementById('jpgQualityVal').style.display=isJpg?'':'none';
  if(p.jpgQuality){document.getElementById('jpgQuality').value=p.jpgQuality;document.getElementById('jpgQualityVal').textContent=p.jpgQuality+'%'}
  debouncedSave();refreshAll();
}

function cyclePresetParallel(idx){
  const p=presets[idx];if(!p||!p.parallelSnapshot)return;
  // Find icon watermarks that have parallel layers in this preset
  let cycled=false;
  for(const wmId in p.parallelSnapshot){
    const numId=parseInt(wmId);
    const wm=watermarks.find(w=>w.id===numId);
    if(!wm||!wm.parallelLayers||wm.parallelLayers.length===0)continue;
    const totalLayers=wm.parallelLayers.length+1; // +1 for base layer
    const curIdx=wm.activeParallelIdx||0;
    const nextIdx=(curIdx+1)%totalLayers;
    switchParallelLayer(wm,nextIdx);
    cycled=true;
  }
  if(cycled){debouncedSave();refreshAll()}
}

function deletePreset(idx){
  presets.splice(idx,1);savePresets();renderPresets();
}

function renamePreset(idx,span){
  const p=presets[idx];if(!p)return;

// ===== Parallel Layers for Icon Watermarks =====
// Each icon watermark can have parallelLayers: [{dataURL, name}]
// activeParallelIdx: 0 = base layer, 1+ = parallel layers
// All parallel layers share the same settings (position, scale, rotation, blend, opacity, etc.)

function addParallelLayer(wm){
  if(wm.type!=='icon')return;
  // Create a file input to upload the parallel layer image
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=async()=>{
    if(!inp.files[0])return;
    const du=await fileToDataURL(inp.files[0]);
    if(!wm.parallelLayers)wm.parallelLayers=[];
    wm.parallelLayers.push({dataURL:du,name:'平行'+(wm.parallelLayers.length+1)});
    debouncedSave();refreshAll();
  };
  inp.click();
}

function removeParallelLayer(wm,layerIdx){
  if(!wm.parallelLayers||layerIdx<0||layerIdx>=wm.parallelLayers.length)return;
  wm.parallelLayers.splice(layerIdx,1);
  // If active was pointing to removed or beyond, reset to 0
  if((wm.activeParallelIdx||0)>wm.parallelLayers.length){
    wm.activeParallelIdx=0;
  }
  // If the removed layer was active, switch to base
  if((wm.activeParallelIdx||0)===layerIdx+1){
    wm.activeParallelIdx=0;
  }else if((wm.activeParallelIdx||0)>layerIdx+1){
    wm.activeParallelIdx=(wm.activeParallelIdx||0)-1;
  }
  debouncedSave();refreshAll();
}

function switchParallelLayer(wm,newIdx){
  if(wm.type!=='icon')return;
  const totalLayers=(wm.parallelLayers?wm.parallelLayers.length:0)+1;
  if(newIdx<0||newIdx>=totalLayers)newIdx=0;
  wm.activeParallelIdx=newIdx;
  // Update the effective dataURL
  // We don't change wm.dataURL; instead, getActiveDataURL returns the right one
  debouncedSave();
}

function getActiveDataURL(wm){
  if(wm.type!=='icon')return wm.dataURL;
  const idx=wm.activeParallelIdx||0;
  if(idx===0||!wm.parallelLayers||wm.parallelLayers.length===0)return wm.dataURL;
  if(idx-1<wm.parallelLayers.length)return wm.parallelLayers[idx-1].dataURL;
  return wm.dataURL;
}

function buildEraserMask(erasers, W, H) {
  const maskCanvas = document.createElement('canvas');
  maskCanvas.width = W; maskCanvas.height = H;
  const mctx = maskCanvas.getContext('2d');
  mctx.fillStyle = '#fff';
  mctx.fillRect(0, 0, W, H);
  for (const er of erasers) {
    const cx = er.x * W, cy = er.y * H, rPx = er.r * W;
    const strength = er.opacity !== undefined ? er.opacity : 1;
    if (er.type === 'hard' || !er.type) {
      mctx.globalCompositeOperation = 'destination-out';
      mctx.globalAlpha = strength;
      mctx.beginPath();
      mctx.arc(cx, cy, rPx, 0, Math.PI * 2);
      mctx.fill();
      mctx.globalCompositeOperation = 'source-over';mctx.globalAlpha = 1;
    } else {
      const hardness = er.hardness !== undefined ? er.hardness : 0.5;
      mctx.globalCompositeOperation = 'destination-out';
      mctx.globalAlpha = 1;
      const grad = mctx.createRadialGradient(cx, cy, 0, cx, cy, rPx);
      grad.addColorStop(0, `rgba(255,255,255,${strength})`);
      if (hardness > 0.01) {
        grad.addColorStop(Math.min(hardness, 0.99), `rgba(255,255,255,${strength})`);
      }
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      mctx.fillStyle = grad;
      mctx.beginPath();
      mctx.arc(cx, cy, rPx, 0, Math.PI * 2);
      mctx.fill();
      mctx.globalCompositeOperation = 'source-over';
      mctx.fillStyle = '#fff';
    }
  }
  return maskCanvas;
}

function drawTileWatermark(oc, wi, ws, W, H) {
  const sc = ws.scale || 1;
  const tw = wi.naturalWidth * sc, th = wi.naturalHeight * sc;
  if(tw < 1 || th < 1) return;
  const patCanvas = document.createElement('canvas');
  patCanvas.width = tw; patCanvas.height = th;
  const pctx = patCanvas.getContext('2d');
  pctx.drawImage(wi, 0, 0, tw, th);
  const pat = oc.createPattern(patCanvas, 'repeat');
  oc.save();
  const ox = (ws.x || 0) * W, oy = (ws.y || 0) * H;
  oc.translate(ox, oy);
  oc.fillStyle = pat;
  oc.fillRect(-ox, -oy, W, H);
  oc.restore();
}

async function renderCanvas(){
  if(!images.length){ctx.clearRect(0,0,canvas.width,canvas.height);return}
  const cur=images[currentIdx],base=await loadImage(cur.dataURL),W=base.naturalWidth,H=base.naturalHeight;
  if(canvas.width!==W)canvas.width=W;if(canvas.height!==H)canvas.height=H;
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.drawImage(base,0,0);

  const ordered=getOrderedWatermarks();
  const ews=ordered.filter(wm=>getWmState(cur,wm.id).enabled);
  const hasEr=cur.erasers&&cur.erasers.length>0;

  let eraserMask = null;
  if (hasEr) {
    eraserMask = buildEraserMask(cur.erasers, W, H);
  }

  for(const wm of ews){
    const ws=getWmState(cur,wm.id),wi=await loadImage(getActiveDataURL(wm)),off=document.createElement('canvas');off.width=W;off.height=H;const oc=off.getContext('2d');oc.clearRect(0,0,W,H);
    if(wm.type==='tile'){
      drawTileWatermark(oc, wi, ws, W, H);
    }
    else{
      const bw=wi.naturalWidth,bh=wi.naturalHeight;
      const iw=bw*ws.scale,ih=bh*ws.scale;
      oc.save();oc.translate(ws.x*W,ws.y*H);oc.rotate(ws.rotation*Math.PI/180);oc.drawImage(wi,-iw/2,-ih/2,iw,ih);oc.restore();
    }

    const shouldErase = eraserMask && !ws.ignoreEraser;
    if (shouldErase) {
      oc.globalCompositeOperation = 'destination-in';
      oc.drawImage(eraserMask, 0, 0);
      oc.globalCompositeOperation = 'source-over';
    }

    ctx.globalCompositeOperation=ws.blendMode||'normal';
    ctx.globalAlpha=ws.opacity!==undefined?ws.opacity:1;
    ctx.drawImage(off,0,0);
  }
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;

  if(hasEr){
    ctx.save();ctx.setLineDash([5,4]);ctx.strokeStyle='rgba(200,168,126,0.5)';ctx.lineWidth=1.5;
    cur.erasers.forEach(er=>{
      ctx.beginPath();ctx.arc(er.x*W,er.y*H,er.r*W,0,Math.PI*2);ctx.stroke();
    });
    ctx.setLineDash([]);ctx.restore();
  }

  if(selectedIconWmId!==null){const wm=watermarks.find(w=>w.id===selectedIconWmId);if(wm&&getWmState(cur,wm.id).enabled){const ws=getWmState(cur,wm.id),wi=await loadImage(getActiveDataURL(wm)),iw=wi.naturalWidth*ws.scale,ih=wi.naturalHeight*ws.scale;ctx.save();ctx.translate(ws.x*W,ws.y*H);ctx.rotate(ws.rotation*Math.PI/180);ctx.setLineDash([4,3]);ctx.strokeStyle='rgba(200,168,126,0.7)';ctx.lineWidth=1.5;ctx.strokeRect(-iw/2,-ih/2,iw,ih);ctx.setLineDash([]);ctx.restore()}}
}

let dragState=null,pinchDist0=null,pinchScale0=null,pinchAng0=null,pinchRot0=null;
function getCC(e){const r=canvas.getBoundingClientRect(),t=e.touches?e.touches[0]:(e.changedTouches?e.changedTouches[0]:e);return{x:(t.clientX-r.left)/r.width,y:(t.clientY-r.top)/r.height,cx:t.clientX,cy:t.clientY}}

function inRotRect(px,py,cx,cy,hw,hh,rd){
  const a=-rd*Math.PI/180,dx=px-cx,dy=py-cy;
  return Math.abs(dx*Math.cos(a)-dy*Math.sin(a))<=hw&&Math.abs(dx*Math.sin(a)+dy*Math.cos(a))<=hh;
}

function iconBounds(wm,cur){
  const ws=getWmState(cur,wm.id),wi=imageCache.get(getActiveDataURL(wm));
  if(!wi)return null;
  const iw=wi.naturalWidth*ws.scale,ih=wi.naturalHeight*ws.scale;
  return{cx:ws.x,cy:ws.y,hw:iw/(2*canvas.width),hh:ih/(2*canvas.height),r:ws.rotation};
}

function findIcon(nx,ny){
  if(!images[currentIdx])return null;
  const cur=images[currentIdx];
  const iconWms=[];
  wmOrderIcon.forEach(id=>{const wm=watermarks.find(w=>w.id===id);if(wm)iconWms.push(wm)});
  for(let i=iconWms.length-1;i>=0;i--){
    const wm=iconWms[i];
    if(getWmState(cur,wm.id).enabled&&!wm.locked){
      const b=iconBounds(wm,cur);
      if(b&&inRotRect(nx,ny,b.cx,b.cy,b.hw*1.3,b.hh*1.3,b.r))return wm;
    }
  }
  return null;
}

function findTile(nx,ny){
  if(!images[currentIdx])return null;
  const cur=images[currentIdx];
  const tileWms=[];
  wmOrderTile.forEach(id=>{const wm=watermarks.find(w=>w.id===id);if(wm)tileWms.push(wm)});
  for(let i=tileWms.length-1;i>=0;i--){
    const wm=tileWms[i];
    if(getWmState(cur,wm.id).enabled&&!wm.locked)return wm;
  }
  return null;
}

function tDist(a,b){return Math.sqrt((a.clientX-b.clientX)**2+(a.clientY-b.clientY)**2)}
function tAng(a,b){return Math.atan2(b.clientY-a.clientY,b.clientX-a.clientX)*180/Math.PI}

function findEraserAt(cur,nx,ny){
  for(let i=cur.erasers.length-1;i>=0;i--){
    const er=cur.erasers[i];
    const dx=er.x-nx,dy=er.y-ny;
    const canvasAspect=canvas.height/canvas.width;
    const dist=Math.sqrt(dx*dx+(dy*canvasAspect)*(dy*canvasAspect));
    if(dist<er.r*1.3)return i;
  }
  return -1;
}

function onDown(e){
  if(!images.length)return;const cur=images[currentIdx];
  if(e.touches&&e.touches.length===2&&selectedIconWmId!==null){
    e.preventDefault();
    const selWm=watermarks.find(w=>w.id===selectedIconWmId);
    if(selWm&&selWm.locked)return;
    const ws=getWmState(cur,selectedIconWmId);
    pinchDist0=tDist(e.touches[0],e.touches[1]);pinchScale0=ws.scale;
    pinchAng0=tAng(e.touches[0],e.touches[1]);pinchRot0=ws.rotation;
    dragState={t:'pinch'};return;
  }
  const isSingleTouch=e.touches?e.touches.length===1:true;
  if(!isSingleTouch)return;
  e.preventDefault();const c=getCC(e);

  if(eraserMode){
    const hitIdx=findEraserAt(cur,c.x,c.y);
    if(hitIdx>=0){
      applyToTargets(img=>{if(img.erasers&&img.erasers.length>hitIdx)img.erasers.splice(hitIdx,1)});
    }else{
      const eType=document.getElementById('eraserType').value;
      const eOpacity=parseInt(document.getElementById('eraserOpacity').value)/100;
      const eHardness=parseInt(document.getElementById('eraserHardness').value)/100;
      const er={x:c.x,y:c.y,r:eraserRadius/canvas.width,type:eType,opacity:eOpacity};
      if(eType==='soft') er.hardness=eHardness;
      applyToTargets(img=>{img.erasers.push({x:er.x,y:er.y,r:er.r,type:er.type,opacity:er.opacity,hardness:er.hardness})});
    }
    debouncedSave();queueRender();return;
  }

  const hit=findIcon(c.x,c.y);
  if(hit){
    selectedIconWmId=hit.id;
    const ws=getWmState(cur,hit.id);
    dragState={t:'move',wid:hit.id,wtype:'icon',ox:c.x-ws.x,oy:c.y-ws.y};
    queueRender();return;
  }

  const tileHit=findTile(c.x,c.y);
  if(tileHit){
    selectedIconWmId=null;
    const ws=getWmState(cur,tileHit.id);
    dragState={t:'move',wid:tileHit.id,wtype:'tile',ox:c.x-ws.x,oy:c.y-ws.y};
    queueRender();return;
  }

  selectedIconWmId=null;
  queueRender();
}

function onMove(e){
  if(!dragState){
    if(eraserMode){
      const ind=document.getElementById('eraserIndicator'),wr=canvasWrap.getBoundingClientRect(),cr=canvas.getBoundingClientRect(),t=e.touches?e.touches[0]:e,d=eraserRadius*2*(cr.width/canvas.width);
      ind.style.display='block';ind.style.width=d+'px';ind.style.height=d+'px';ind.style.left=(t.clientX-wr.left-d/2)+'px';ind.style.top=(t.clientY-wr.top-d/2)+'px';
    }
    return;
  }
  e.preventDefault();const cur=images[currentIdx];
  if(dragState.t==='pinch'&&e.touches&&e.touches.length===2){
    const dist=tDist(e.touches[0],e.touches[1]),ang=tAng(e.touches[0],e.touches[1]);
    const ns=Math.max(.1,Math.min(10,pinchScale0*(dist/pinchDist0))),nr=pinchRot0+(ang-pinchAng0);
    applyToTargets(img=>{const ws=getWmState(img,selectedIconWmId);ws.scale=ns;ws.rotation=nr});
    queueRender();debouncedSave();renderWmLists();return;
  }
  if(dragState.t==='move'){
    const c=getCC(e);
    const nx=c.x-dragState.ox, ny=c.y-dragState.oy;
    applyToTargets(img=>{const ws=getWmState(img,dragState.wid);ws.x=nx;ws.y=ny});
    queueRender();debouncedSave();
  }
}

function onUp(){
  if(dragState){dragState=null;pinchDist0=pinchScale0=pinchAng0=pinchRot0=null;debouncedSave()}
}

canvas.addEventListener('mousedown',onDown);
canvas.addEventListener('mousemove',onMove);
canvas.addEventListener('mouseup',onUp);
canvas.addEventListener('mouseleave',()=>{onUp();document.getElementById('eraserIndicator').style.display='none'});
canvas.addEventListener('touchstart',onDown,{passive:false});
canvas.addEventListener('touchmove',onMove,{passive:false});
canvas.addEventListener('touchend',onUp);

canvas.addEventListener('wheel',e=>{
  if(selectedIconWmId===null)return;
  const selWm=watermarks.find(w=>w.id===selectedIconWmId);
  if(selWm&&selWm.locked)return;
  e.preventDefault();
  if(e.shiftKey){
    const d=e.deltaY>0?-5:5;
    applyToTargets(img=>{getWmState(img,selectedIconWmId).rotation=(getWmState(img,selectedIconWmId).rotation+d)%360});
  }else{
    const d=e.deltaY>0?-.05:.05;
    applyToTargets(img=>{const ws=getWmState(img,selectedIconWmId);ws.scale=Math.max(.05,Math.min(10,ws.scale+d))});
  }
  queueRender();debouncedSave();renderWmLists();
},{passive:false});

canvasWrap.addEventListener('mousemove',e=>{
  if(!eraserMode||dragState)return;
  const ind=document.getElementById('eraserIndicator'),wr=canvasWrap.getBoundingClientRect(),cr=canvas.getBoundingClientRect(),d=eraserRadius*2*(cr.width/canvas.width);
  ind.style.display='block';ind.style.width=d+'px';ind.style.height=d+'px';ind.style.left=(e.clientX-wr.left-d/2)+'px';ind.style.top=(e.clientY-wr.top-d/2)+'px';
});
canvasWrap.addEventListener('mouseleave',()=>{document.getElementById('eraserIndicator').style.display='none'});

async function renderFinal(imgObj){
  const base=await loadImage(imgObj.dataURL),W=base.naturalWidth,H=base.naturalHeight,c=document.createElement('canvas');c.width=W;c.height=H;const cx=c.getContext('2d');
  cx.globalCompositeOperation='source-over';cx.globalAlpha=1;cx.drawImage(base,0,0);
  const ordered=getOrderedWatermarks();
  const ews=ordered.filter(wm=>getWmState(imgObj,wm.id).enabled);
  const hasEr=imgObj.erasers&&imgObj.erasers.length>0;

  let eraserMask = null;
  if (hasEr) {
    eraserMask = buildEraserMask(imgObj.erasers, W, H);
  }

  for(const wm of ews){
    const ws=getWmState(imgObj,wm.id),wi=await loadImage(getActiveDataURL(wm)),off=document.createElement('canvas');off.width=W;off.height=H;const oc=off.getContext('2d');
    if(wm.type==='tile'){
      drawTileWatermark(oc, wi, ws, W, H);
    }
    else{
      const iw=wi.naturalWidth*ws.scale,ih=wi.naturalHeight*ws.scale;
      oc.save();oc.translate(ws.x*W,ws.y*H);oc.rotate(ws.rotation*Math.PI/180);oc.drawImage(wi,-iw/2,-ih/2,iw,ih);oc.restore();
    }

    const shouldErase = eraserMask && !ws.ignoreEraser;
    if (shouldErase) {
      oc.globalCompositeOperation = 'destination-in';
      oc.drawImage(eraserMask, 0, 0);
      oc.globalCompositeOperation = 'source-over';
    }

    cx.globalCompositeOperation=ws.blendMode||'normal';
    cx.globalAlpha=ws.opacity!==undefined?ws.opacity:1;
    cx.drawImage(off,0,0);}
  cx.globalCompositeOperation='source-over';cx.globalAlpha=1;return c;
}

// Render final at reduced size for GIF (returns canvas at target width)
async function renderFinalSmall(imgObj, targetW){
  const full=await renderFinal(imgObj);
  const scale=targetW/full.width;
  const sc=document.createElement('canvas');
  sc.width=targetW;sc.height=Math.round(full.height*scale);
  sc.getContext('2d').drawImage(full,0,0,sc.width,sc.height);
  return sc;
}

function getExpCfg(){const f=document.getElementById('exportFormat').value,q=parseInt(document.getElementById('jpgQuality').value)/100;return f==='jpg'?{mime:'image/jpeg',ext:'jpg',q}:{mime:'image/png',ext:'png',q:1}}

function doDownload(cvs,name){
  const cfg=getExpCfg();
  cvs.toBlob(blob=>{
    if(!blob)return;
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=name+'.'+cfg.ext;
    document.body.appendChild(a);a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url)},500);
  },cfg.mime,cfg.q);
}

function doDownloadBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url)},500);
}

async function buildCollageCanvas(){
  if(!collageSelected.length)return null;
  const cols=parseInt(document.getElementById('collageCols').value)||2;
  const rows=parseInt(document.getElementById('collageRows').value)||2;
  const gap=parseInt(document.getElementById('collageGap').value)||0;
  const bgColor=document.getElementById('collageBg').value;
  const showNum=document.getElementById('collageNumSwitch').classList.contains('on');
  const numFont=document.getElementById('collageNumFont').value;
  const numPos=document.getElementById('collageNumPos').value;
  const numSize=parseInt(document.getElementById('collageNumSize').value)||36;
  const numColor=document.getElementById('collageNumColor').value;

  const rendered=[];
  for(const idx of collageSelected){
    rendered.push(await renderFinal(images[idx]));
  }

  let maxW=0,maxH=0;
  rendered.forEach(c=>{if(c.width>maxW)maxW=c.width;if(c.height>maxH)maxH=c.height});

  const totalW=cols*maxW+(cols+1)*gap;
  const totalH=rows*maxH+(rows+1)*gap;
  const out=document.createElement('canvas');out.width=totalW;out.height=totalH;
  const ox=out.getContext('2d');
  ox.fillStyle=bgColor;ox.fillRect(0,0,totalW,totalH);

  for(let i=0;i<rendered.length&&i<cols*rows;i++){
    const col=i%cols,row=Math.floor(i/cols);
    const x=gap+col*(maxW+gap),y=gap+row*(maxH+gap);
    const cvs=rendered[i];
    const dx=x+(maxW-cvs.width)/2,dy=y+(maxH-cvs.height)/2;
    ox.drawImage(cvs,dx,dy);

    if(showNum){
      ox.save();
      ox.font=`bold ${numSize}px "${numFont}", sans-serif`;
      ox.fillStyle=numColor;
      ox.textBaseline='top';
      const txt=''+(i+1);
      const tm=ox.measureText(txt);
      const pad=numSize*0.3;
      let nx,ny;
      if(numPos==='tl'){nx=x+pad;ny=y+pad}
      else if(numPos==='tr'){nx=x+maxW-tm.width-pad;ny=y+pad}
      else if(numPos==='bl'){nx=x+pad;ny=y+maxH-numSize-pad}
      else if(numPos==='br'){nx=x+maxW-tm.width-pad;ny=y+maxH-numSize-pad}
      else{nx=x+(maxW-tm.width)/2;ny=y+maxH-numSize-pad}
      ox.fillText(txt,nx,ny);
      ox.restore();
    }
  }
  return out;
}

async function exportCollage(){
  const cvs=await buildCollageCanvas();
  if(!cvs)return;
  doDownload(cvs,'collage');
}

async function exportGif(){
  if(!gifSelected.length)return;
  const outW=Math.min(parseInt(document.getElementById('gifWidth').value)||480, 800);
  const fps=Math.min(parseInt(document.getElementById('gifFps').value)||10, 20);
  const frameDuration=parseFloat(document.getElementById('gifDuration').value)||1;
  const transDuration=parseFloat(document.getElementById('gifTransDuration').value)||0.5;
  const effect=document.getElementById('gifEffect').value;
  const quality=document.getElementById('gifQuality').value;

  const prevWrap=document.getElementById('gifPreview');
  prevWrap.innerHTML='<span style="font-size:10px;color:var(--text-dim)">渲染帧中... 0%</span>';

  // Pre-render all images at small size using JPG-quality reduction
  const rendered=[];
  for(let i=0;i<gifSelected.length;i++){
    const sc=await renderFinalSmall(images[gifSelected[i]], outW);
    rendered.push(sc);
    prevWrap.innerHTML=`<span style="font-size:10px;color:var(--text-dim)">渲染图片 ${i+1}/${gifSelected.length}...</span>`;
    await new Promise(r=>setTimeout(r,0));
  }

  // Normalize height
  let maxH=0;rendered.forEach(c=>{if(c.height>maxH)maxH=c.height});
  const outH=maxH;

  const frameMs=1000/fps;
  const holdFrames=Math.max(1,Math.round(frameDuration*fps));
  const transFrames=effect==='none'?0:Math.max(1,Math.round(transDuration*fps));

  const encoder=new GIFEncoder(outW,outH,quality);
  const tmpCanvas=document.createElement('canvas');tmpCanvas.width=outW;tmpCanvas.height=outH;
  const tc=tmpCanvas.getContext('2d');

  function drawCentered(ctx2,src){
    ctx2.fillStyle='#000';ctx2.fillRect(0,0,outW,outH);
    const dx=(outW-src.width)/2,dy=(outH-src.height)/2;
    ctx2.drawImage(src,dx,dy);
  }

  const totalFrames=rendered.length*holdFrames+(rendered.length>1?(rendered.length-1)*transFrames:0);
  let frameCount=0;

  for(let i=0;i<rendered.length;i++){
    // Hold frames - only add key frames (skip duplicates, use delay multiplier)
    drawCentered(tc,rendered[i]);
    encoder.addFrame(tmpCanvas, frameMs*holdFrames);
    frameCount+=holdFrames;
    prevWrap.innerHTML=`<span style="font-size:10px;color:var(--text-dim)">编码中... ${Math.round(frameCount/totalFrames*50)}%</span>`;
    await new Promise(r=>setTimeout(r,0));

    // Transition to next
    if(transFrames>0&&i<rendered.length-1){
      const next=rendered[i+1];
      const curr=rendered[i];
      // For transitions, render fewer intermediate frames
      const actualTransFrames=Math.min(transFrames, 8);
      for(let f=0;f<actualTransFrames;f++){
        const t=(f+1)/actualTransFrames;
        tc.fillStyle='#000';tc.fillRect(0,0,outW,outH);
        if(effect==='fade'||effect==='smooth'){
          tc.globalAlpha=1-t;drawCentered(tc,curr);
          tc.globalAlpha=t;drawCentered(tc,next);
          tc.globalAlpha=1;
        }else if(effect==='slide-left'){
          const offset=Math.round(t*outW);
          tc.drawImage(curr,-offset,(outH-curr.height)/2);
          tc.drawImage(next,outW-offset,(outH-next.height)/2);
        }else if(effect==='slide-right'){
          const offset=Math.round(t*outW);
          tc.drawImage(curr,offset,(outH-curr.height)/2);
          tc.drawImage(next,-outW+offset,(outH-next.height)/2);
        }else if(effect==='slide-up'){
          const offset=Math.round(t*outH);
          tc.drawImage(curr,(outW-curr.width)/2,-offset);
          tc.drawImage(next,(outW-next.width)/2,outH-offset);
        }else if(effect==='zoom'){
          const s1=1-t*0.3;const s2=0.7+t*0.3;
          tc.globalAlpha=1-t;
          tc.save();tc.translate(outW/2,outH/2);tc.scale(s1,s1);tc.translate(-outW/2,-outH/2);drawCentered(tc,curr);tc.restore();
          tc.globalAlpha=t;
          tc.save();tc.translate(outW/2,outH/2);tc.scale(s2,s2);tc.translate(-outW/2,-outH/2);drawCentered(tc,next);tc.restore();
          tc.globalAlpha=1;
        }else{
          drawCentered(tc,next);
        }
        const delayPerTransFrame=Math.round(frameMs*transFrames/actualTransFrames);
        encoder.addFrame(tmpCanvas, delayPerTransFrame);
        frameCount+=Math.round(transFrames/actualTransFrames);
        await new Promise(r=>setTimeout(r,0));
      }
      prevWrap.innerHTML=`<span style="font-size:10px;color:var(--text-dim)">编码中... ${Math.round(frameCount/totalFrames*50)}%</span>`;
    }
  }

  prevWrap.innerHTML='<span style="font-size:10px;color:var(--text-dim)">压缩GIF中... 50%</span>';
  await new Promise(r=>setTimeout(r,50));

  try{
    const gifData=await encoder.encode((done,total)=>{
      const pct=50+Math.round(done/total*50);
      prevWrap.innerHTML=`<span style="font-size:10px;color:var(--text-dim)">压缩GIF中... ${pct}%</span>`;
    });
    const blob=new Blob([gifData],{type:'image/gif'});
    doDownloadBlob(blob,'animation.gif');

    const url=URL.createObjectURL(blob);
    prevWrap.innerHTML='';
    const img=document.createElement('img');img.src=url;img.style.maxWidth='100%';img.style.maxHeight='200px';
    prevWrap.appendChild(img);
    const sizeInfo=document.createElement('span');sizeInfo.style.cssText='font-size:9px;color:var(--text-dim);position:absolute;bottom:4px;right:8px';
    sizeInfo.textContent=(blob.size/1024).toFixed(0)+'KB';
    prevWrap.style.position='relative';
    prevWrap.appendChild(sizeInfo);
  }catch(err){
    prevWrap.innerHTML=`<span style="font-size:10px;color:#e88">导出失败: ${err.message||'未知错误'}</span>`;
  }
}

(async()=>{await openDB();await loadState();renderPresets();refreshAll();setTimeout(positionPresetFixedBtns,100)})();
</script>
